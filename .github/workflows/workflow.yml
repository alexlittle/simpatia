# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install
        run: uv sync --extra api

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Validate content
        run: uv run python scripts/validate_content.py

      - name: Test
        run: uv run pytest -q --cov=simpatia --cov-report=xml

      - name: Get version
        id: ver
        run: echo "v=$(uv run python -c 'import simpatia; print(simpatia.__version__)')" >> "$GITHUB_OUTPUT"

      - name: SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: -Dsonar.projectVersion=${{ steps.ver.outputs.v }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
