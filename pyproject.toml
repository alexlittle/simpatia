[project]
name = "simpatia"
version = "0.1.0"
description = "LLM-based simulated patients for clinical communication practice"
readme = "README.md"
authors = [
    { name = "Alex Little", email = "alex@alexlittle.net" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "openai>=1.54",              # OpenAI-compatible: Ollama, vLLM, OpenRouter, OpenAI
    "lingua-language-detector>=2.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]  # only if you go cloud
api = [
    "fastapi>=0.115.3",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
]
examiner = ["pydantic-ai>=0.0.20"]

[project.scripts]
simpatia = "simpatia.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.3",
    "mypy>=1.13",
    "typer>=0.15",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
asyncio_mode = "auto"
markers = [
    "llm: hits a real LLM API — costs money, excluded by default",
]
addopts = "-m 'not llm'"

[tool.mypy]
strict = true
files = ["src/simpatia"]
