[project]
name = "simpatia"
version = "0.1.0"
description = "LLM-based simulated patients for clinical communication practice"
readme = "README.md"
authors = [
    { name = "Alex Little", email = "alex@alexlittle.net" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "openai>=3.13.0",              # OpenAI-compatible: Ollama, vLLM, OpenRouter, OpenAI
    "lingua-language-detector>=2.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]  # only if you go cloud
api = [
    "fastapi>=0.115.3",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.42",
]
examiner = ["pydantic-ai>=2.43.0"]

[project.scripts]
simpatia = "simpatia.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.8",
    "mypy>=1.13",
    "typer>=0.27.2",
    "httpx>=0.27",
    "pytest-cov>=7.1.0"
]
docs = [
    "sphinx>=8.1",
    "furo>=2024.8",
    "myst-parser>=4.0",
    "autodoc-pydantic>=2.2",
    "sphinx-autobuild>=2024.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
asyncio_mode = "auto"
markers = [
    "llm: hits a real LLM API — costs money, excluded by default",
]
addopts = "-m 'not llm'"

[tool.mypy]
strict = true
files = ["src/simpatia"]
